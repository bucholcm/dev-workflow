[project]
name = "dev-orchestrator"
version = "0.1.0"
description = "Local AI dev-workflow orchestrator: Linear (planning) + Bitbucket (code), routing implementation to Claude Code / Codex with a manual, human-in-the-loop review → fix → merge loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
dev-orchestrator = "dev_orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long prose in prompt templates and JSON literals in tests are intentional.
per-file-ignores = { "src/dev_orchestrator/prompts.py" = ["E501"], "tests/*" = ["E501"] }
